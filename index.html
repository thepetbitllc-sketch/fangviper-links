  <style>
    /* FANG VIPER - Links. Luxury-house look matching the store: white, warm ink #19110B, cream, Jost. */
    :root {
      --bg: #fff;
      --fg: #19110b;
      --mute: #6b645d;
      --dim: #a39d96;
      --line: #e8e4de;
      --cream: #faf4eb;
      --tile: #f6f5f3;
      --body: Jost, "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(.2, .8, .2, 1);
      color-scheme: light;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { min-height: 100vh; min-height: 100svh; background: var(--bg); color: var(--fg); font: 400 15px/1.55 var(--body); letter-spacing: .01em; -webkit-font-smoothing: antialiased; }
    img, svg { display: block; }
    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    ul { list-style: none; }
    ::selection { background: var(--fg); color: #fff; }
    :focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }

    .bar { height: 64px; display: grid; place-items: center; border-bottom: 1px solid var(--line); }
    .bar__mark { font: 400 22px/1 var(--body); letter-spacing: .24em; padding-left: .24em; text-transform: uppercase; }

    .wrap { width: 100%; max-width: 480px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }

    /* ---------- header ---------- */
    .head { text-align: center; padding: 28px 0 36px; }
    .head__photo { display: block; aspect-ratio: 4 / 5; overflow: hidden; background: var(--tile); margin: 0 -16px 32px; }
    .head__photo img { width: 100%; height: 100%; object-fit: cover; }
    .head__name { font: 400 30px/1.15 var(--body); letter-spacing: .01em; }
    .head__tag { margin-top: 8px; color: var(--mute); font-size: 14px; }

    /* ---------- primary buttons ---------- */
    .cta { display: grid; gap: 12px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      height: 54px; padding: 0 28px; border-radius: 100px; border: 1px solid var(--fg);
      font: 400 15px/1 var(--body); letter-spacing: .02em;
      transition: background .3s var(--ease), color .3s var(--ease);
    }
    .btn--ink { background: var(--fg); color: #fff; }
    .btn--ink:hover { background: #fff; color: var(--fg); }
    .btn--line:hover { background: var(--fg); color: #fff; }
    .btn small { font-size: 12px; opacity: .6; }

    /* ---------- groups ---------- */
    .group { margin-top: 48px; }
    .label { text-align: center; margin-bottom: 14px; font: 400 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
    .stack { border-top: 1px solid var(--line); }

    /* ---------- link rows (hairlines, no boxes) ---------- */
    .link { display: flex; align-items: center; gap: 16px; min-height: 62px; padding: 10px 4px; border-bottom: 1px solid var(--line); transition: background .3s var(--ease), padding .3s var(--ease); }
    .link__icon { flex: none; width: 20px; height: 20px; display: grid; place-items: center; }
    .link__icon svg { width: 18px; height: 18px; }
    .link__text { flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .link__name { font-size: 15px; }
    .link__handle { font-size: 13px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link__arrow { flex: none; width: 14px; height: 14px; color: var(--dim); transition: transform .35s var(--ease), color .35s; }
    @media (hover: hover) {
      .link:hover { background: var(--tile); padding-left: 12px; padding-right: 12px; }
      .link:hover .link__arrow { transform: translate(2px, -2px); color: var(--fg); }
    }

    /* ---------- footer ---------- */
    .foot { margin-top: 56px; text-align: center; font-size: 12px; color: var(--mute); }

    /* ---------- entrance ---------- */
    @media (prefers-reduced-motion: no-preference) {
      .rv { opacity: 0; transform: translateY(10px); animation: rv .9s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 50ms + 60ms); }
      @keyframes rv { to { opacity: 1; transform: none; } }
    }
